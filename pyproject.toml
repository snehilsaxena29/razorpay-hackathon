[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gauntlet"
version = "0.1.0"
description = "An adversarial test harness for payment-capable AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
gauntlet = "gauntlet.cli:main"

[tool.setuptools]
packages = ["gauntlet", "gauntlet.attacks", "gauntlet.attacks.catalogue", "gauntlet.judge", "gauntlet.llm", "gauntlet.report", "subjects"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "RUF001",  # ambiguous unicode in strings: homoglyph attacks require them
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"gauntlet/attacks/catalogue/*" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false
files = ["gauntlet", "subjects"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: requires a real LLM provider (deselected by default)",
]

[tool.coverage.run]
branch = true
source = ["gauntlet", "subjects"]
